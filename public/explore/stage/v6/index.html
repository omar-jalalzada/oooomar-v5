<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>omar.build — stage v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B0B0C;--mute:#8A8A92;--accent:#195CFF;--soft:#BFD0FF;--line:#EAEAEC;--bg:#FFFFFF;
    --ease:cubic-bezier(.2,.75,.2,1);--spring:cubic-bezier(.34,1.4,.5,1);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;overflow:hidden;height:100vh;}

  .viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;z-index:2;}
  .viewport.drag{cursor:grabbing;}
  .bloom{position:fixed;top:50%;left:50%;width:1100px;height:1100px;transform:translate(-50%,-50%);opacity:0;
    background:radial-gradient(closest-side at 40% 45%,rgba(255,211,165,.30),transparent 70%),
      radial-gradient(closest-side at 60% 42%,rgba(195,182,255,.30),transparent 70%),
      radial-gradient(closest-side at 52% 62%,rgba(165,216,255,.32),transparent 70%);
    filter:blur(46px);border-radius:50%;pointer-events:none;z-index:1;animation:fade 2.4s var(--ease) forwards;}
  @keyframes fade{to{opacity:1;}}

  /* the world — larger than the viewport; you pan it */
  .canvas{position:absolute;top:50%;left:50%;width:2200px;height:1500px;transform-origin:center;
    transform:translate(-50%,-50%) scale(1.5);will-change:transform;}

  /* centerpiece */
  .mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;}
  .mark svg{display:block;width:100%;height:auto;overflow:visible;}
  .blk{opacity:0;transform-box:fill-box;transform-origin:bottom;transform:translateY(42px) scaleY(.7);}
  .play .blk{animation:assemble .72s var(--spring) forwards;animation-delay:calc(.2s + var(--i)*.045s);}
  @keyframes assemble{to{opacity:1;transform:none;}}
  .eye{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);}
  .play .eye{animation:eyepop .55s var(--spring) 1.05s forwards;}
  @keyframes eyepop{to{opacity:1;transform:scale(1);}}
  .subline{position:absolute;top:calc(50% + 130px);left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;color:var(--mute);opacity:0;animation:fade 1.2s var(--ease) 1.4s forwards;}

  /* work cards — varied sizes, organized around Omar */
  .card{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:16px;background:#fff;
    overflow:hidden;cursor:pointer;opacity:0;filter:blur(8px);
    transition:opacity .7s ease,filter .7s ease,box-shadow .45s var(--ease),border-color .4s,scale .45s var(--ease);}
  .card.reveal{opacity:1;filter:blur(0);}
  .card:hover{box-shadow:0 34px 70px -28px rgba(20,40,120,.45);border-color:var(--accent);scale:1.03;z-index:20;}
  .pad{padding:22px;display:flex;flex-direction:column;gap:12px;height:100%;}
  .title{font-weight:700;letter-spacing:-.01em;line-height:1.08;}
  .excerpt{font-size:14px;line-height:1.5;color:#5A5A62;}
  .note .title{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;}
  .preview{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#F4F4F6;border:1px solid var(--line);flex:1;min-height:120px;}
  .preview iframe{position:absolute;top:0;left:0;width:200%;height:200%;transform:scale(.5);transform-origin:top left;border:0;pointer-events:none;}
  /* meta hidden until hover */
  .meta{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--accent);
    opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s var(--ease);}
  .card:hover .meta{opacity:1;transform:none;}
  .meta .date{color:var(--mute);}

  /* dock — fixed to the window (doesn't pan) */
  .dock{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150%);z-index:40;
    display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;background:rgba(255,255,255,.72);
    backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
    border:1px solid rgba(0,0,0,.06);border-radius:999px;box-shadow:0 24px 60px -22px rgba(20,40,120,.4);
    opacity:0;transition:transform .8s var(--spring),opacity .6s ease;}
  .dock.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .dmark{display:flex;align-items:center;padding-right:12px;border-right:1px solid var(--line);margin-right:6px;}
  .omark{position:relative;width:22px;height:22px;background:var(--accent);border-radius:4px;}
  .omark::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);}
  .dock a{font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;padding:9px 15px;border-radius:999px;transition:background .25s,color .25s;}
  .dock a:hover{background:var(--accent);color:#fff;} .dock a.off{color:var(--mute);}

  .hint{position:fixed;top:28px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--mute);z-index:30;opacity:0;transition:opacity .5s;}
  .hint.show{opacity:1;}
</style>
</head>
<body>
  <div class="bloom"></div>
  <div class="viewport" id="viewport">
    <div class="canvas" id="canvas">
      <div class="mark" id="mark">
        <svg viewBox="403 624 1232 281" xmlns="http://www.w3.org/2000/svg">
          <g fill="#195CFF" stroke="#195CFF" stroke-width="1.3" stroke-linejoin="round">
            <rect class="blk" x="1491" y="631" width="69" height="163"/>
            <rect class="blk" x="450" y="631" width="254" height="233"/>
            <rect class="blk" x="714" y="631" width="103" height="233"/>
            <path class="blk" d="M817 631L866 690.744V864L817 804.256 817 631Z"/>
            <path class="blk" d="M915 631L866 690.744V864L915 804.256 915 631Z"/>
            <rect class="blk" x="915" y="631" width="103" height="233"/>
            <rect class="blk" x="1031" y="631" width="122" height="233"/>
            <rect class="blk" x="1319" y="631" width="103" height="233"/>
            <rect class="blk" x="1203" y="631" width="103" height="233"/>
            <path class="blk" d="M1186 631H1246C1279.14 631 1306 657.863 1306 691V864H1186V631Z"/>
            <rect class="blk" x="1134" y="631" width="69" height="90"/>
            <rect class="blk" x="1422" y="631" width="69" height="90"/>
            <rect class="blk" x="1134" y="709" width="69" height="85"/>
            <rect class="blk" x="1422" y="721" width="69" height="73"/>
            <path class="blk" d="M1421 792H1516L1560 864H1471L1421 792Z"/>
          </g>
          <circle class="eye" cx="574" cy="747" r="24" fill="#FFFFFF"/>
          <circle class="eye" cx="1169" cy="734" r="24" fill="#FFFFFF"/>
          <circle class="eye" cx="1469" cy="734" r="24" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="subline">Always a work in progress</div>
    </div>
  </div>

  <div class="hint" id="hint">DRAG TO EXPLORE</div>

  <nav class="dock" id="dock">
    <div class="dmark"><span class="omark"></span></div>
    <a href="#">Writing</a><a href="#">Labs</a><a href="#" class="off">About</a>
  </nav>

<script>
  const mark=document.getElementById('mark'), canvas=document.getElementById('canvas'), viewport=document.getElementById('viewport');
  const blks=[...mark.querySelectorAll('.blk')];
  blks.map(b=>({b,x:b.getBBox().x})).sort((a,c)=>a.x-c.x).forEach((o,i)=>o.b.style.setProperty('--i',i));
  requestAnimationFrame(()=>mark.classList.add('play'));
  const eyes=[...document.querySelectorAll('.eye')]; let track=false; setTimeout(()=>track=true,1500);

  // canvas coords are within 2200x1500 (center 1100,750). Varied sizes, organized around Omar.
  const items=[
    {kind:'ESSAY · LEADERSHIP',title:'Designing Security from Zero to Series D',date:'JUN 2026',excerpt:'What building a design function inside a cybersecurity startup taught me about craft and outcomes.',w:330,h:240,x:540,y:430},
    {kind:'LAB · GEOMETRY',title:'Girih',date:'2026',lab:'girih',w:260,h:280,x:1690,y:440},
    {kind:'ESSAY · LEADERSHIP',title:'Manage the Work, Not the People',date:'JUN 2026',excerpt:'Lead like a midfielder, not a coach yelling from the sideline.',w:250,h:210,x:420,y:840},
    {kind:'LAB · TEXTURE',title:'Grain',date:'2026',lab:'grain',w:300,h:300,x:1740,y:880},
    {kind:'NOTE · REFLECTIONS',title:'“Taste isn’t downloaded; it’s accrued — through patience.”',date:'JUN 2026',cls:'note',w:240,h:200,x:700,y:1200},
    {kind:'REFLECTION',title:'Systems for a Calm Life',date:'MAY 2026',excerpt:'Treating maturity as an architecture problem, not a personality trait.',w:250,h:220,x:1560,y:1240},
  ];
  const cards=[];
  items.forEach((it,i)=>{
    const c=document.createElement('div'); c.className='card '+(it.cls||''); c.style.width=it.w+'px'; c.style.height=it.h+'px';
    c.style.left=it.x+'px'; c.style.top=it.y+'px';
    const body = it.lab
      ? `<div class="preview"><iframe src="/prototypes/${it.lab}/index.html" loading="lazy" scrolling="no"></iframe></div>`
      : (it.excerpt ? `<div class="excerpt">${it.excerpt}</div>` : '');
    const titleFirst = it.cls==='note';
    c.innerHTML=`<div class="pad">${titleFirst?`<div class="title" style="font-size:21px">${it.title}</div>`:''}
      ${body}
      ${!titleFirst?`<div class="title" style="font-size:${it.lab?20:(it.w>300?28:20)}px">${it.title}</div>`:''}
      <div class="meta"><span>${it.kind}</span><span class="date">${it.date}</span></div></div>`;
    canvas.appendChild(c); cards.push(c);
  });

  // ---- camera: pull back to reveal (no flying cards) ----
  const state={x:0,y:0,scale:1.5}; let panReady=false;
  const CW=2200, CH=1500;
  function clamp(){const mx=Math.max(0,(CW*state.scale-innerWidth)/2), my=Math.max(0,(CH*state.scale-innerHeight)/2);
    state.x=Math.max(-mx,Math.min(mx,state.x)); state.y=Math.max(-my,Math.min(my,state.y));}
  function apply(t){canvas.style.transition=t||'none';canvas.style.transform=`translate(-50%,-50%) translate(${state.x}px,${state.y}px) scale(${state.scale})`;}
  apply();
  setTimeout(()=>{ // after Omar assembles, pull the camera back
    state.scale=1; clamp(); apply('transform 1.5s cubic-bezier(.2,.75,.2,1)');
    cards.forEach((c,i)=>setTimeout(()=>c.classList.add('reveal'), 250+i*90));
    setTimeout(()=>{panReady=true; document.getElementById('hint').classList.add('show');
      setTimeout(()=>document.getElementById('hint').classList.remove('show'),3000);}, 1400);
  },1200);

  // ---- pan: drag + wheel ----
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  viewport.addEventListener('pointerdown',e=>{if(!panReady||e.target.closest('.card'))return;dragging=true;viewport.classList.add('drag');sx=e.clientX;sy=e.clientY;ox=state.x;oy=state.y;});
  addEventListener('pointermove',e=>{
    if(dragging){state.x=ox+(e.clientX-sx);state.y=oy+(e.clientY-sy);clamp();apply();document.getElementById('hint').classList.remove('show');}
    if(track){const dx=(e.clientX-innerWidth/2)/innerWidth,dy=(e.clientY-innerHeight/2)/innerHeight;eyes.forEach(el=>el.style.transform=`translate(${dx*22}px,${dy*22}px) scale(1)`);}
  });
  addEventListener('pointerup',()=>{dragging=false;viewport.classList.remove('drag');});
  viewport.addEventListener('wheel',e=>{if(!panReady)return;e.preventDefault();state.x-=e.deltaX;state.y-=e.deltaY;clamp();apply();document.getElementById('hint').classList.remove('show');},{passive:false});

  setTimeout(()=>document.getElementById('dock').classList.add('show'),2400);
</script>
</body>
</html>
