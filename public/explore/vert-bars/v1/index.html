<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vert-bars v1 — bar-field reconstruction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1a0f1c;
    color: #f4f0f5;
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .hud {
    position: fixed; left: 20px; bottom: 20px; z-index: 2;
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  .hud .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }
  .modes { display: flex; gap: 8px; pointer-events: auto; }
  button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.04em;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.35);
    color: #fff; padding: 8px 12px; border-radius: 999px;
    cursor: pointer; backdrop-filter: blur(8px);
  }
  button.active { border-color: #ffd36a; color: #ffd36a; }
  .note {
    position: fixed; right: 20px; bottom: 20px; z-index: 2;
    max-width: 34ch;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; line-height: 1.45;
    color: rgba(255,255,255,0.45);
    text-align: right;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="label">explore / vert-bars / v1</div>
    <div class="modes">
      <button data-mode="shield" class="active">shield</button>
      <button data-mode="blobs">blobs</button>
    </div>
  </div>
  <p class="note">
    Recreation of Oğuz Yağız Kara’s bar-field look:
    silhouette → vertical capsules → noise jitter → faux detection HUD.
  </p>

<script>
/* ─────────────────────────────────────────────────────────
 * ANIMATION STORYBOARD
 *
 *    every frame
 *      1. clear
 *      2. sample silhouette into vertical columns
 *      3. draw rounded capsules (height from mask + noise)
 *      4. bloom pass (cheap canvas blur)
 *      5. overlay detection boxes / coords / leaders
 * ───────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const bloom = document.createElement('canvas');
const bctx = bloom.getContext('2d');

const PARAMS = {
  cols: 110,
  barWidth: 0.55,     // fraction of column width
  jitter: 6,          // px vertical noise on bar ends
  noiseAmp: 0.08,     // threshold wobble
  glowBlur: 18,
};

let mode = 'shield';
let W = 0, H = 0, dpr = 1;
let mouse = { x: 0.5, y: 0.5 };
let t0 = performance.now();

document.querySelectorAll('[data-mode]').forEach((btn) => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('active', b === btn));
  });
});

window.addEventListener('pointermove', (e) => {
  mouse.x = e.clientX / window.innerWidth;
  mouse.y = e.clientY / window.innerHeight;
});

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = bloom.width = Math.floor(W * dpr);
  canvas.height = bloom.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// --- cheap value noise ---
function hash(n) {
  const x = Math.sin(n * 127.1) * 43758.5453;
  return x - Math.floor(x);
}
function noise1(x, seed = 0) {
  const i = Math.floor(x);
  const f = x - i;
  const u = f * f * (3 - 2 * f);
  return hash(i + seed) * (1 - u) + hash(i + 1 + seed) * u;
}

// --- SDFs ---
function sdSegment(px, py, ax, ay, bx, by, r) {
  const pax = px - ax, pay = py - ay;
  const bax = bx - ax, bay = by - ay;
  const h = Math.max(0, Math.min(1, (pax * bax + pay * bay) / (bax * bax + bay * bay)));
  const dx = pax - bax * h, dy = pay - bay * h;
  return Math.hypot(dx, dy) - r;
}
function sdBox(px, py, cx, cy, hx, hy, r = 0) {
  const dx = Math.abs(px - cx) - hx + r;
  const dy = Math.abs(py - cy) - hy + r;
  const ox = Math.max(dx, 0), oy = Math.max(dy, 0);
  return Math.min(Math.max(dx, dy), 0) + Math.hypot(ox, oy) - r;
}
function opU(a, b) { return Math.min(a, b); }
function opS(a, b) { return Math.max(a, -b); }

/** Shield + checkmark in normalized [-1,1] space around center. */
function shieldSDF(x, y) {
  // shield body: rounded kite
  const top = sdBox(x, y + 0.05, 0, -0.15, 0.42, 0.48, 0.08);
  const bottom = Math.hypot(x * 1.15, (y - 0.35) * 1.6) - 0.55;
  let shield = opU(top, bottom);
  // hollow interior
  const innerTop = sdBox(x, y + 0.05, 0, -0.15, 0.30, 0.36, 0.06);
  const innerBottom = Math.hypot(x * 1.15, (y - 0.28) * 1.6) - 0.38;
  const inner = opU(innerTop, innerBottom);
  shield = opS(shield, inner - 0.02);
  // checkmark
  const a = sdSegment(x, y, -0.16, 0.02, -0.02, 0.18, 0.045);
  const b = sdSegment(x, y, -0.02, 0.18, 0.24, -0.16, 0.045);
  const check = opU(a, b);
  return opU(shield, check);
}

/** Soft metaball field for the organic / magenta reference. */
function blobField(x, y, time) {
  const blobs = [
    [Math.sin(time * 0.7) * 0.25, Math.cos(time * 0.5) * 0.2, 0.28],
    [Math.cos(time * 0.4) * 0.35, Math.sin(time * 0.6) * 0.3, 0.22],
    [-0.25 + Math.sin(time * 0.9) * 0.15, 0.15, 0.18],
    [0.2, -0.25 + Math.cos(time * 0.8) * 0.12, 0.16],
    [mouse.x * 2 - 1, mouse.y * 2 - 1, 0.2],
  ];
  let d = 0;
  for (const [bx, by, r] of blobs) {
    const dist = Math.hypot(x - bx, y - by);
    d += (r * r) / (dist * dist + 0.0008);
  }
  return 1.1 - d; // negative inside
}

function sampleColumn(nx, mode, time) {
  // walk vertical samples in normalized space, collect intervals where SDF < 0
  const samples = 160;
  const intervals = [];
  let inside = false;
  let start = 0;
  for (let i = 0; i <= samples; i++) {
    const ny = (i / samples) * 2 - 1;
    const n = noise1(nx * 40 + time * 0.4, 3) * PARAMS.noiseAmp;
    const d = mode === 'shield' ? shieldSDF(nx, ny) : blobField(nx, ny, time);
    const nowInside = d + n < 0;
    if (nowInside && !inside) { inside = true; start = ny; }
    if (!nowInside && inside) {
      inside = false;
      intervals.push([start, ny]);
    }
  }
  if (inside) intervals.push([start, 1]);
  return intervals;
}

function barColor(mode, yNorm, strength) {
  if (mode === 'shield') {
    // yellow (top) → red (bottom)
    const t = (yNorm + 1) * 0.5;
    const r = 255;
    const g = Math.floor(210 - t * 160);
    const b = Math.floor(60 - t * 40);
    const a = 0.55 + strength * 0.45;
    return `rgba(${r},${g},${Math.max(0, b)},${a})`;
  }
  // magenta / white core
  const a = 0.35 + strength * 0.65;
  return `rgba(255, 120, 210, ${a})`;
}

function drawBars(time) {
  const cols = PARAMS.cols;
  const colW = W / cols;
  const barW = Math.max(1.2, colW * PARAMS.barWidth);

  bctx.clearRect(0, 0, W, H);
  bctx.fillStyle = mode === 'shield' ? '#f7f5f2' : '#1a0f1c';
  bctx.fillRect(0, 0, W, H);

  for (let i = 0; i < cols; i++) {
    const nx = (i + 0.5) / cols * 2 - 1;
    const intervals = sampleColumn(nx, mode, time);
    const cx = (i + 0.5) * colW;

    // faint background chatter
    if (hash(i * 17.3) > 0.82) {
      const h = 4 + hash(i * 9.1) * 18;
      const y = hash(i * 3.7) * H;
      bctx.fillStyle = mode === 'shield' ? 'rgba(255,160,80,0.12)' : 'rgba(255,90,180,0.12)';
      roundBar(bctx, cx, y, barW * 0.7, h);
    }

    for (const [y0, y1] of intervals) {
      const top = ((y0 + 1) * 0.5) * H + (noise1(i * 0.7 + time, 1) - 0.5) * PARAMS.jitter;
      const bot = ((y1 + 1) * 0.5) * H + (noise1(i * 0.7 + time, 2) - 0.5) * PARAMS.jitter;
      const h = Math.max(2, bot - top);
      const midY = (top + bot) / 2;
      const yNorm = (midY / H) * 2 - 1;
      const strength = Math.min(1, h / (H * 0.18));
      bctx.fillStyle = barColor(mode, yNorm, strength);
      roundBar(bctx, cx, midY, barW, h);
      if (mode === 'blobs' && strength > 0.55) {
        bctx.fillStyle = `rgba(255,255,255,${0.25 * strength})`;
        roundBar(bctx, cx, midY, barW * 0.45, h * 0.7);
      }
    }
  }

  // bloom composite
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = mode === 'shield' ? '#f7f5f2' : '#1a0f1c';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.filter = `blur(${PARAMS.glowBlur}px)`;
  ctx.globalAlpha = mode === 'shield' ? 0.45 : 0.75;
  ctx.drawImage(bloom, 0, 0, W, H);
  ctx.restore();

  ctx.globalAlpha = 1;
  ctx.drawImage(bloom, 0, 0, W, H);
}

function roundBar(c, cx, cy, w, h) {
  const x = cx - w / 2;
  const y = cy - h / 2;
  const r = Math.min(w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
  c.fill();
}

function findClusters(time) {
  // coarse grid scan for HUD boxes — centroids of dense columns
  const clusters = [];
  const cols = 24;
  const rows = 18;
  const visited = new Set();
  const cell = (cx, cy) => {
    const nx = (cx + 0.5) / cols * 2 - 1;
    const ny = (cy + 0.5) / rows * 2 - 1;
    const d = mode === 'shield' ? shieldSDF(nx, ny) : blobField(nx, ny, time);
    return d < -0.02;
  };

  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const key = cx + ',' + cy;
      if (visited.has(key) || !cell(cx, cy)) continue;
      // flood fill
      const stack = [[cx, cy]];
      visited.add(key);
      let minX = cx, maxX = cx, minY = cy, maxY = cy, n = 0;
      while (stack.length) {
        const [x, y] = stack.pop();
        n++;
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx = x + dx, ny = y + dy;
          const k = nx + ',' + ny;
          if (nx < 0 || ny < 0 || nx >= cols || ny >= rows || visited.has(k)) continue;
          if (!cell(nx, ny)) continue;
          visited.add(k);
          stack.push([nx, ny]);
        }
      }
      if (n < 3) continue;
      const pad = 8;
      clusters.push({
        x: (minX / cols) * W - pad,
        y: (minY / rows) * H - pad,
        w: ((maxX - minX + 1) / cols) * W + pad * 2,
        h: ((maxY - minY + 1) / rows) * H + pad * 2,
      });
    }
  }
  // keep a manageable set
  clusters.sort((a, b) => b.w * b.h - a.w * a.h);
  return clusters.slice(0, mode === 'shield' ? 3 : 8);
}

function drawHUD(clusters) {
  const stroke = mode === 'shield' ? '#e8892f' : '#f0d24a';
  const fill = mode === 'shield' ? '#e8892f' : '#f0d24a';
  ctx.save();
  ctx.lineWidth = 1.25;
  ctx.strokeStyle = stroke;
  ctx.font = '500 11px "JetBrains Mono", monospace';

  // polyline through centers
  if (clusters.length > 1) {
    ctx.beginPath();
    clusters.forEach((c, i) => {
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
      if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
    });
    ctx.stroke();
  }

  clusters.forEach((c) => {
    ctx.strokeRect(c.x, c.y, c.w, c.h);
    const label = `${Math.round(c.x)}, ${Math.round(c.y)}`;
    const tw = ctx.measureText(label).width + 10;
    const lx = c.x;
    const ly = Math.max(14, c.y - 4);
    ctx.fillStyle = fill;
    ctx.fillRect(lx, ly - 12, tw, 14);
    ctx.fillStyle = mode === 'shield' ? '#fff' : '#111';
    ctx.fillText(label, lx + 5, ly - 1);
  });
  ctx.restore();
}

function frame(now) {
  const time = (now - t0) / 1000;
  drawBars(time);
  drawHUD(findClusters(time));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
