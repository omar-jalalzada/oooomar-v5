<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Tricks v9 — no grain</title>
  <!--
    Card Tricks: a card system for showing experiments on the portfolio, in three
    consistent layers plus the motion running through them:
      01 background — gradients, colour, texture
      02 line work  — one generator: mark × repeat × sweep × pin × anchor
      03 type       — name first, one stat under it, techniques on the margin
      04 motion     — hover: one eased value drives all three layers, at three depths   (this pass)
    Each layer is its own module (background.js, visuals.js, type.js) so the composite imports them as-is.

    URL params (used by the dev screenshot API):
      ?preset=card-tricks|atlas|bar-field|farsh|naughty-narwal|sankey
      ?fig=<figure>    load a figure preset over the card (lobes, ripple, rays, contours…)
      ?t=<seconds>     freeze the clock at a moment
      ?still=1         start paused
      ?layer=background|visuals|type|motion   which bench opens
      ?hover=1&px=&py= hold the card in its hover pose, pointer at px/py (-1..1)
      ?figure=0        hide the drawing on the type bench
      ?ground=0        visuals over a flat dark card instead of the gradient
      ?handles=0       hide the handles
      ?bare=1          stage only, no panels
  -->
  <style>
    :root {
      --page: #f4f4f5;
      --panel: #ffffff;
      --line: #e4e4e7;
      --ink: #18181b;
      --dim: #71717a;
      --faint: #a1a1aa;
      --accent: #195cff;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font: 12px/1.45 var(--mono);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      grid-template-columns: 216px minmax(0, 1fr) 280px;
      gap: 10px;
      padding: 10px;
    }

    body.bare { grid-template-columns: minmax(0, 1fr); padding: 0; }
    body.bare .panel, body.bare .bar, body.bare .hint { display: none; }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .panel > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
      padding: 11px 12px 10px;
      border-bottom: 1px solid var(--line);
    }

    .panel h1, .panel h2 {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel .meta {
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .scroll {
      overflow-y: auto;
      overscroll-behavior: contain;
      min-height: 0;
      padding: 8px;
    }

    .section-title {
      margin: 10px 6px 6px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── left: layers + palettes ─────────────────────────────────────────── */

    .layer {
      width: 100%;
      background: none;
      font: inherit;
      text-align: left;
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 2px;
      padding: 7px 6px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--faint);
    }

    button.layer { color: var(--dim); cursor: pointer; }
    button.layer:hover { background: #fafafa; border-color: var(--line); }

    .layer[aria-current='true'],
    button.layer[aria-current='true']:hover {
      border-color: color-mix(in srgb, var(--accent) 34%, transparent);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      color: var(--ink);
    }

    .layer .n { font-variant-numeric: tabular-nums; }
    .layer b { display: block; font-weight: 600; }
    .layer span { display: block; font-size: 10px; }
    .layer .tag { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }

    .item {
      display: grid;
      grid-template-columns: 44px 1fr;
      align-items: center;
      gap: 9px;
      width: 100%;
      margin-bottom: 4px;
      padding: 6px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .item:hover { background: #fafafa; border-color: var(--line); }

    .item[aria-current='true'] {
      border-color: color-mix(in srgb, var(--accent) 34%, transparent);
      background: color-mix(in srgb, var(--accent) 6%, transparent);
    }

    .item .thumb {
      display: grid;
      place-items: center;
      width: 44px;
      height: 56px;
    }

    .item canvas { display: block; border-radius: 3px; }
    .item b { display: block; font-weight: 600; }
    .item span { display: block; color: var(--faint); font-size: 10px; }

    /* ── centre: the stage ───────────────────────────────────────────────── */

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-radius: 10px;
      background: var(--backdrop, var(--page));
      transition: background 0.3s ease;
    }

    .stage[data-backdrop='dark'] { --backdrop: #141416; }

    #pit {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-height: 0;
    }

    #card {
      position: relative;
      flex: none;
    }

    #card {
      border-radius: var(--r, 0);
      box-shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 20px 40px -24px rgba(9, 9, 11, 0.45);
    }

    body.no-ground:not([data-layer='background']) #card { background: #26272b; }

    #card canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: var(--r, 0);
    }

    #face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: var(--r, 0);
    }

    #face #vis, #typeWrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    body[data-layer='motion'] #handles { display: none; }
    body[data-layer='motion'] #card { cursor: pointer; outline: none; will-change: transform; }
    body[data-layer='motion'] #card:focus-visible { outline: 1px solid var(--accent); outline-offset: 6px; }

    body[data-layer='background'] #groundBtn { display: none; }
    body:not([data-layer='type']) #figureBtn { display: none; }

    #handles {
      position: absolute;
      inset: 0;
      overflow: visible;
      touch-action: none;
    }

    body.no-handles #handles { display: none; }

    #handles ellipse {
      fill: none;
      stroke: rgba(255, 255, 255, 0.55);
      stroke-width: 0.5;
      stroke-dasharray: 3 3;
      pointer-events: none;
    }

    #handles ellipse.sel { stroke: #fff; stroke-dasharray: none; stroke-width: 1; }

    #handles .dot {
      stroke: #fff;
      stroke-width: 1.5;
      cursor: grab;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
    }

    #handles .dot.sel { stroke-width: 2.5; }

    #handles .knob {
      fill: #fff;
      cursor: nwse-resize;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
    }

    #handles .knob[data-kind='rx'] { cursor: ew-resize; }
    #handles .knob[data-kind='ry'] { cursor: ns-resize; }

    #handles .catch { fill: transparent; cursor: move; }

    #handles .box {
      fill: none;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 0.5;
      stroke-dasharray: 2 3;
      pointer-events: none;
    }

    #handles .grid { stroke: rgba(255, 255, 255, 0.07); stroke-width: 0.5; }
    #handles .grid.major { stroke: rgba(255, 255, 255, 0.14); }
    #handles .margin { fill: none; stroke: rgba(255, 90, 160, 0.7); stroke-width: 0.5; }
    #handles .rule { stroke: rgba(255, 90, 160, 0.5); stroke-width: 0.5; stroke-dasharray: 4 3; }

    #handles .cross {
      stroke: rgba(255, 255, 255, 0.8);
      stroke-width: 1;
      pointer-events: none;
    }

    #ref {
      position: relative;
      flex: none;
      display: none;
    }

    #ref.on { display: block; }

    #ref img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }

    #ref button {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    #drop {
      position: absolute;
      inset: 8px;
      display: none;
      place-items: center;
      border: 1px dashed var(--accent);
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 6%, transparent);
      color: var(--accent);
      pointer-events: none;
    }

    body.dragging #drop { display: grid; }

    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      align-self: center;
      flex: none;
      margin: 0 0 12px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
    }

    .bar button {
      padding: 4px 12px;
      border: none;
      border-radius: 999px;
      background: #f4f4f5;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .bar button:hover { background: #e9e9ec; }
    .bar button[aria-pressed='true'] { background: var(--ink); color: #fff; }

    .bar .switch { border-radius: 999px; }
    .bar .switch button { padding: 2px 10px; background: transparent; }
    .bar .switch button[aria-pressed='true'] { background: var(--panel); color: var(--ink); }

    .bar .read {
      padding: 0 8px;
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      top: 12px;
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-align: center;
      pointer-events: none;
    }

    .stage[data-backdrop='dark'] .hint { color: #52525b; }

    /* ── right: the dials ────────────────────────────────────────────────── */

    #live {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #live::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22c55e;
    }

    body.paused #live::before { background: var(--faint); }

    .group + .group { margin-top: 6px; border-top: 1px solid var(--line); }

    .group > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 6px 7px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      list-style: none;
    }

    .group > summary::-webkit-details-marker { display: none; }
    .group > summary::after { content: '−'; color: var(--faint); }
    .group:not([open]) > summary::after { content: '+'; }

    .dial { padding: 4px 6px 8px; }

    .dial .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .dial label {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .dial input[type='number'] {
      width: 68px;
      flex: none;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel);
      color: inherit;
      font: inherit;
      text-align: right;
      font-variant-numeric: tabular-nums;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .dial input[type='number']::-webkit-outer-spin-button,
    .dial input[type='number']::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .dial input:focus-visible {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }

    .dial input[type='text'] {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel);
      color: inherit;
      font: inherit;
    }

    .dial input[type='range'] {
      width: 100%;
      height: 14px;
      margin: 0;
      accent-color: var(--accent);
      cursor: ew-resize;
    }

    .switch {
      display: flex;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f4f4f5;
    }

    .switch button {
      flex: 1;
      padding: 4px 0;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--dim);
      font: inherit;
      cursor: pointer;
    }

    .switch.wrap { flex-wrap: wrap; gap: 2px; }
    .switch.wrap button { flex: 1 0 30%; }

    .switch button[aria-pressed='true'] {
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(9, 9, 11, 0.08);
    }

    /* fields list */

    .swatch {
      position: relative;
      flex: none;
      width: 18px;
      height: 18px;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
      cursor: pointer;
    }

    .swatch input {
      position: absolute;
      inset: -6px;
      width: 30px;
      height: 30px;
      border: none;
      padding: 0;
      opacity: 0;
      cursor: pointer;
    }

    .frow {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }

    .frow:hover { background: #fafafa; }
    .frow[aria-current='true'] { border-color: var(--line); background: #fafafa; }
    .frow .name { flex: 1; min-width: 0; }
    .frow .hex { color: var(--faint); font-variant-numeric: tabular-nums; }

    .mini {
      flex: none;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel);
      color: var(--dim);
      font: inherit;
      font-size: 10px;
      cursor: pointer;
    }

    .mini:hover { color: var(--ink); background: #fafafa; }
    .mini:disabled { opacity: 0.4; cursor: default; }

    .ftools {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 6px 4px;
    }

    .sub {
      margin: 6px 6px 2px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .acts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: none;
      padding: 9px;
      border-top: 1px solid var(--line);
    }

    .acts button {
      flex: 1 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--dim);
      font: inherit;
      white-space: nowrap;
      cursor: pointer;
    }

    .acts button:hover { background: #fafafa; color: var(--ink); }

    @media (max-width: 1000px) {
      body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 40vh; }
      .panel:first-child { display: none; }
      body.bare { grid-template-rows: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <aside class="panel">
    <header>
      <h1>Card tricks</h1>
      <span class="meta">v9</span>
    </header>
    <div class="scroll">
      <p class="section-title">Layers</p>
      <div id="layers"></div>
      <p class="section-title">Experiment cards</p>
      <div id="presets"></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <p class="hint" id="hint">drag a dot to move a field · white knobs resize · drop or paste a reference image to sample colours</p>
    <div id="pit">
      <div id="card">
        <div id="face">
          <canvas id="bg"></canvas>
          <canvas id="vis"></canvas>
          <div id="typeWrap"><div id="type"></div></div>
        </div>
        <svg id="handles"></svg>
      </div>
      <div id="ref">
        <img alt="Reference" />
        <button type="button" title="Remove reference">×</button>
      </div>
    </div>
    <div class="bar">
      <button id="playBtn" type="button">Pause</button>
      <button id="handlesBtn" type="button" aria-pressed="true">Handles</button>
      <button id="groundBtn" type="button" aria-pressed="true" title="Show the gradient under the drawing (g)">Ground</button>
      <button id="figureBtn" type="button" aria-pressed="true" title="Show the drawing under the type (f)">Figure</button>
      <div class="switch" id="backdrop">
        <button type="button" data-v="page" aria-pressed="true">Page</button>
        <button type="button" data-v="tint">Tint</button>
        <button type="button" data-v="dark">Dark</button>
      </div>
      <span class="read" id="readout">—</span>
    </div>
    <div id="drop">drop a reference image</div>
  </main>

  <aside class="panel">
    <header>
      <h2 id="panelTitle">01 Background</h2>
      <span id="live">live</span>
    </header>
    <div class="scroll" id="dials"></div>
    <div class="acts">
      <button id="resetBtn" type="button">Reset layer</button>
      <button id="copyBtn" type="button">Copy settings</button>
      <button id="pasteBtn" type="button">Paste</button>
    </div>
  </aside>

  <script type="module" src="./main.js"></script>
</body>
</html>
