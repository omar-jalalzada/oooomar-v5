<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Card Tricks v11 — the composite, starting with one card. No bench: the layer modules
    are copied from v10 unchanged, and composite.js is the only new code. A card is an
    element with data-card="<experiment slug>"; adding the other five is adding elements.
  -->
  <title>Card Tricks v11 — the composite</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: #18181b;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 64px 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 320px));
      justify-content: center;
      gap: 24px;
      width: 100%;
    }

    [data-card] {
      position: relative;
      width: 100%;
      border-radius: var(--r, 0);
      cursor: pointer;
      outline: none;
      will-change: transform;
      box-shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 20px 40px -24px rgba(9, 9, 11, 0.45);
    }
    [data-card]:focus-visible { outline: 1px solid #18181b; outline-offset: 6px; }

    .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: var(--r, 0);
    }
    .face canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .face > div {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #readout {
      position: fixed;
      right: 16px;
      bottom: 12px;
      color: #71717a;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main>
    <div class="grid">
      <div data-card="card-tricks"></div>
    </div>
  </main>
  <div id="readout" aria-live="off"></div>
  <script type="module" src="./composite.js"></script>
</body>
</html>
