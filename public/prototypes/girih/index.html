<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Girih</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F4F1EA; }
    canvas { display: block; }
    .hint {
      position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #A39C8C; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <p class="hint">move your cursor — the stars turn toward you</p>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let w, h;
    const GAP = 132;
    const mouse = { x: -9999, y: -9999 };

    function resize() {
      w = canvas.width = innerWidth;
      h = canvas.height = innerHeight;
    }

    // an eight-point star: 16 vertices alternating outer / inner radius
    function star(cx, cy, outer, rot) {
      const inner = outer * 0.42;
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const r = i % 2 === 0 ? outer : inner;
        const a = rot + (i * Math.PI) / 8;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function frame(t) {
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#1B5E4A';
      ctx.lineWidth = 1.4;
      for (let x = GAP / 2; x < w + GAP; x += GAP) {
        for (let y = GAP / 2; y < h + GAP; y += GAP) {
          const dist = Math.hypot(mouse.x - x, mouse.y - y);
          const pull = Math.max(0, 1 - dist / 360);
          const rot = t / 6000 + pull * 0.8;
          star(x, y, GAP * 0.46, rot);
        }
      }
      requestAnimationFrame(frame);
    }

    addEventListener('resize', resize);
    addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener('pointerleave', () => { mouse.x = -9999; mouse.y = -9999; });

    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
