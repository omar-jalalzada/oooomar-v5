<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor Field</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
    canvas { display: block; }
    .hint {
      position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #555; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <p class="hint">move your cursor — the field follows</p>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let w, h, dots;

    const GAP = 28;
    const mouse = { x: -9999, y: -9999 };

    function setup() {
      w = canvas.width = innerWidth;
      h = canvas.height = innerHeight;
      dots = [];
      for (let x = GAP / 2; x < w; x += GAP) {
        for (let y = GAP / 2; y < h; y += GAP) {
          dots.push({ x, y });
        }
      }
    }

    function frame() {
      ctx.clearRect(0, 0, w, h);
      for (const d of dots) {
        const dx = mouse.x - d.x;
        const dy = mouse.y - d.y;
        const dist = Math.hypot(dx, dy);
        const pull = Math.max(0, 1 - dist / 240);
        const angle = Math.atan2(dy, dx);
        const len = 2 + pull * 10;
        const alpha = 0.18 + pull * 0.82;
        ctx.strokeStyle = `rgba(235, 235, 235, ${alpha})`;
        ctx.lineWidth = 1 + pull;
        ctx.beginPath();
        ctx.moveTo(d.x - Math.cos(angle) * len / 2, d.y - Math.sin(angle) * len / 2);
        ctx.lineTo(d.x + Math.cos(angle) * len / 2, d.y + Math.sin(angle) * len / 2);
        ctx.stroke();
      }
      requestAnimationFrame(frame);
    }

    addEventListener('resize', setup);
    addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener('pointerleave', () => { mouse.x = -9999; mouse.y = -9999; });

    setup();
    frame();
  </script>
</body>
</html>
