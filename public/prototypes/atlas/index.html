<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atlas</title>
  <!-- cobe.module.js is COBE 2.0.1 vendored so the folder stays self-contained and offline.
       It has no dependencies and ships a browser-ready ES module, so it is copied, not bundled:
         npm i -D cobe@2.0.1
         cp node_modules/cobe/dist/index.esm.js public/prototypes/atlas/cobe.module.js
       data.json is generated from the raw Swarm export (never committed):
         python3 scripts/build-atlas-data.py <export-dir> public/prototypes/atlas/data.json -->
  <style>
    :root {
      --bg: #fcfcfd;
      --rule: #dadeea;
      --ink: #0b0b0c;
      --ink-2: #5c5c66;
      --ink-3: #9b9ba6;
      --accent: #195cff;
      --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }

    #globe {
      position: absolute; display: block; cursor: grab;
      touch-action: none; user-select: none; -webkit-user-select: none;
      opacity: 0; transition: opacity 600ms ease;
    }
    #globe.ready { opacity: 1; }
    #globe.dragging { cursor: grabbing; }

    .overlay { position: absolute; inset: 0; pointer-events: none; color: var(--ink); }
    .overlay > * { pointer-events: auto; }

    .brand { position: absolute; top: 20px; left: 24px; }
    .brand h1 {
      margin: 0; font: 600 13px/1 var(--mono);
      letter-spacing: 0.42em; text-transform: uppercase; color: var(--ink);
    }
    .brand p {
      margin: 8px 0 0; font: 400 12px/1.3 var(--mono);
      letter-spacing: 0.02em; color: var(--ink-2);
    }

    /* photo stack — a fixed slot right of the globe */
    .stack {
      position: absolute; right: 56px; top: 50%;
      width: 248px; height: 320px; margin-top: -200px;
      pointer-events: none;
    }
    .stack .card {
      position: absolute; inset: 0 0 36px 0;
      padding: 8px; background: #fff; border-radius: 4px;
      box-shadow:
        0 0 0 0.5px rgba(11,11,12,0.08),
        0 1px 2px rgba(25,35,90,0.06),
        0 12px 32px -12px rgba(25,35,90,0.28);
      transform: translate(var(--x), var(--y)) rotate(var(--r));
      transition: transform 560ms var(--ease-out), opacity 320ms ease;
      transition-delay: var(--d);
    }
    .stack .card img {
      display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px;
      outline: 0.5px solid rgba(11,11,12,0.06); outline-offset: -0.5px;
    }
    .stack .card.pre { opacity: 0; transform: translate(0, 24px) rotate(0deg) scale(0.94); }
    .stack .cap {
      position: absolute; left: 0; right: 0; bottom: 0;
      font: 500 11px/1.3 var(--mono); letter-spacing: 0.04em; color: var(--ink-2);
      transition: opacity 320ms ease; transition-delay: var(--d);
    }
    .stack .cap.pre { opacity: 0; }
    .stack.out .card, .stack.out .cap {
      opacity: 0; transition-delay: 0ms; transition-duration: 200ms;
    }

    /* bottom scrubber */
    .scrubber {
      position: absolute; left: 24px; right: 24px; bottom: 22px;
      display: flex; align-items: center; gap: 16px;
    }
    .play {
      flex: none; width: 36px; height: 36px; border-radius: 999px;
      border: 1px solid var(--rule); background: #fff; cursor: pointer;
      display: grid; place-items: center; color: var(--ink);
      box-shadow: 0 1px 2px rgba(25,35,90,0.06), 0 6px 16px -8px rgba(25,92,255,0.18);
      transition: transform 120ms cubic-bezier(0.34,1.28,0.4,1), border-color 120ms ease;
    }
    .play:hover { transform: scale(1.06); border-color: var(--accent); }
    .play:active { transform: scale(0.96); }
    .play svg { display: block; }

    .track-wrap { flex: 1; min-width: 0; }
    .readout {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 8px; gap: 16px;
    }
    .readout .when { font: 500 13px/1 var(--mono); letter-spacing: 0.06em; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .readout .where { color: var(--accent); margin-left: 12px; letter-spacing: 0.02em; }
    .readout .totals { font: 400 12px/1 var(--mono); letter-spacing: 0.01em; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .readout .totals b { color: var(--ink); font-weight: 600; }

    .track { position: relative; height: 20px; cursor: pointer; touch-action: none; }
    .track .rail { position: absolute; top: 8px; left: 0; right: 0; height: 2px; background: var(--rule); border-radius: 2px; }
    .track .fill { position: absolute; top: 8px; left: 0; height: 2px; background: var(--accent); border-radius: 2px; }
    .track .tick { position: absolute; top: 4px; width: 1px; height: 10px; background: var(--rule); }
    .track .tick span {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      font: 400 9px/1 var(--mono); color: var(--ink-3); letter-spacing: 0.04em;
    }
    .track .handle {
      position: absolute; top: 9px; width: 13px; height: 13px; border-radius: 999px;
      background: #fff; border: 2px solid var(--accent); transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px -1px rgba(25,92,255,0.4); transition: transform 80ms ease;
    }
    .track:hover .handle { transform: translate(-50%, -50%) scale(1.12); }

    /* Keep in step with NARROW in the script: the globe gives up the right slot. */
    @media (max-width: 900px) {
      .stack { right: 16px; top: auto; bottom: 104px; margin-top: 0; width: 132px; height: 176px; }
      .stack .card { bottom: 28px; padding: 5px; }
      .stack .cap { font-size: 10px; }
    }
    @media (max-width: 640px) {
      .brand { top: 16px; left: 16px; }
      .scrubber { left: 16px; right: 16px; bottom: 16px; gap: 12px; }
      .readout { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stack .card, .stack .card.pre { transform: translate(var(--x), var(--y)) rotate(var(--r)); }
    }
  </style>
</head>
<body>
  <canvas id="globe"></canvas>
  <div class="overlay">
    <div class="brand">
      <h1>Atlas</h1>
      <p>every check-in since 2011</p>
    </div>
    <div class="stack" id="stack" aria-live="polite"></div>
    <div class="scrubber">
      <button class="play" id="play" aria-label="Play the decade">
        <svg id="playIcon" width="13" height="14" viewBox="0 0 13 14"><path d="M1 1l11 6L1 13z" fill="currentColor"/></svg>
      </button>
      <div class="track-wrap">
        <div class="readout">
          <span class="when"><span id="when"></span><span class="where" id="where"></span></span>
          <span class="totals" id="totals"></span>
        </div>
        <div class="track" id="track">
          <div class="rail"></div>
          <div class="fill" id="fill"></div>
          <div class="handle" id="handle"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import createGlobe from './cobe.module.js';

    const [data, moments] = await Promise.all([
      fetch('./data.json').then(r => r.json()),
      fetch('./moments.json').then(r => r.json()).then(m => m.moments).catch(() => []),
    ]);

    // ---- tuning --------------------------------------------------------------
    const MIN_ARC_KM = 150;          // shorter hops (SF -> Oakland) never draw an arc
    const ARC_COUNT = 12;            // only the latest arcs stay on the globe
    const ARC_FADE_IN_MS = 450;
    const PLAY_SECONDS = 20;         // the quiet stretches of the decade at full speed
    const TRAVEL_DAYS_PER_SEC = 45;  // playback slows to this around a trip
    const NARROW = 900;              // keep in step with the max-width media query
    const ACCENT = [25 / 255, 92 / 255, 1];
    const PAPER = [252 / 255, 252 / 255, 253 / 255];

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    // ---- the day timeline ----------------------------------------------------
    const DAY_MS = 864e5;
    const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY_MS; };
    const DAY0 = dayNum(data.meta.firstDay);
    const NDAYS = dayNum(data.meta.lastDay) - DAY0 + 1;
    const dayIndex = s => Math.max(0, Math.min(NDAYS - 1, dayNum(s) - DAY0));
    const dateOf = i => new Date((DAY0 + i) * DAY_MS);
    const fmtDay = i => dateOf(i).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric' });
    const fmtMonth = i => dateOf(i).toLocaleDateString('en-US', { timeZone: 'UTC', month: 'short', year: 'numeric' });
    const fmt = n => n.toLocaleString('en-US');

    const cities = data.cities;
    const stays = data.stays.map(s => ({ ...s, at: dayIndex(s.start) }));
    const travel = data.legs.filter(l => l.km >= MIN_ARC_KM).map(l => ({ ...l, at: dayIndex(l.date) }));
    const shots = moments.map(m => ({ ...m, at: dayIndex(m.date) })).sort((a, b) => a.at - b.at);
    const logMax = Math.log1p(Math.max(...cities.map(c => c.count)));

    // Days close to a trip play slowly, so each arc lands where you can see it.
    const nearTravel = new Uint8Array(NDAYS);
    for (const l of travel) for (let d = l.at - 3; d <= l.at + 10; d++) if (d >= 0 && d < NDAYS) nearTravel[d] = 1;

    // ---- state at a given day --------------------------------------------------
    function stateAt(day) {
      const cum = new Float64Array(cities.length);
      let checkins = 0, current = null;
      for (const s of stays) {
        if (s.at > day) break;
        cum[s.city] += s.count; checkins += s.count; current = s;
      }
      const markers = [], countries = new Set();
      for (let i = 0; i < cities.length; i++) {
        if (!cum[i]) continue;
        const c = cities[i];
        countries.add(c.countryCode);
        markers.push({ location: [c.lat, c.lng], size: 0.012 + 0.028 * Math.log1p(cum[i]) / logMax });
      }
      let n = 0;
      while (n < travel.length && travel[n].at <= day) n++;
      const legs = travel.slice(Math.max(0, n - ARC_COUNT), n);
      return { checkins, markers, countries: countries.size, current, legs };
    }

    // ---- camera --------------------------------------------------------------
    const anglesFor = c => [Math.PI - (c.lng * Math.PI / 180 - Math.PI / 2), Math.max(-0.7, Math.min(0.7, c.lat * Math.PI / 180 * 0.8))];
    const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

    // ---- layout + globe --------------------------------------------------------
    const canvas = document.getElementById('globe');
    let size = 0, dpr = 1;
    function layout() {
      const W = innerWidth, H = innerHeight;
      const narrow = W <= NARROW;
      // Narrow screens stack the photos under the globe, so the globe keeps clear of them.
      const top = narrow ? 64 : 24, bottom = narrow ? (shots.length ? 296 : 112) : 104;
      const availH = H - top - bottom;
      // Wide: centre the globe, but slide it left when the photo slot (right 56 + 248 + gap)
      // would reach it. COBE draws the sphere inside the canvas's inner 80%, so the canvas
      // itself may tuck under the slot by that margin.
      const slot = 328;
      size = Math.max(160, Math.floor(Math.min(availH, narrow ? W - 32 : W - slot - 24)));
      const left = narrow ? (W - size) / 2 : Math.min((W - size) / 2, W - slot - size * 0.9);
      dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.style.width = canvas.style.height = size + 'px';
      canvas.style.left = Math.round(left) + 'px';
      canvas.style.top = Math.round(top + (availH - size) / 2) + 'px';
    }
    layout();

    const pParam = new URLSearchParams(location.search).get('p');
    let head = pParam !== null ? Math.max(0, Math.min(1, parseFloat(pParam) || 0)) * (NDAYS - 1) : NDAYS - 1;
    let shown = -1, st = stateAt(Math.floor(head));

    // At the end of the decade the last check-in is wherever the latest trip ended, so open on
    // the most visited city instead; anywhere earlier, open on where you were that day.
    const home = st.current && head < NDAYS - 1 ? cities[st.current.city] : cities[0];
    let [phi, theta] = anglesFor(home);

    const globe = createGlobe(canvas, {
      devicePixelRatio: dpr, width: size, height: size,
      phi, theta, dark: 0, diffuse: 1.2, scale: 1,
      // In light mode a land dot is baseColor * (1 - mapBrightness * coverage), so anything over 1
      // prints the dot centres solid black; ~0.6 keeps the land a quiet grey under the markers.
      mapSamples: 20000, mapBrightness: 0.6, mapBaseBrightness: 0,
      baseColor: [1, 1, 1], markerColor: ACCENT, glowColor: [0.93, 0.94, 0.98],
      arcColor: ACCENT, arcWidth: 0.6, arcHeight: 0.25, markerElevation: 0.01,
      markers: [], arcs: [], opacity: 1,
      context: { alpha: true, antialias: true },
    });
    requestAnimationFrame(() => canvas.classList.add('ready'));

    // ---- arcs: newest fades in, older ones fade back toward the paper ---------
    const arcBorn = new Map();   // leg -> time it first appeared during playback
    function arcsFor(legs, now) {
      let fading = false;
      const arcs = legs.map((l, k) => {
        const age = (legs.length - 1 - k) / Math.max(1, ARC_COUNT - 1);   // 0 = newest
        let a = 1 - 0.75 * age;
        const born = arcBorn.get(l);
        if (born !== undefined) {
          const t = Math.min(1, (now - born) / ARC_FADE_IN_MS);
          if (t < 1) fading = true;
          a *= t;
        }
        const color = ACCENT.map((v, i) => PAPER[i] + (v - PAPER[i]) * a);
        const from = cities[l.from], to = cities[l.to];
        return { from: [from.lat, from.lng], to: [to.lat, to.lng], color };
      });
      return { arcs, fading };
    }

    // ---- readout + scrubber ----------------------------------------------------
    const whenEl = document.getElementById('when');
    const whereEl = document.getElementById('where');
    const totalsEl = document.getElementById('totals');
    const fillEl = document.getElementById('fill');
    const handleEl = document.getElementById('handle');
    const trackEl = document.getElementById('track');

    function syncUI(day) {
      const pct = day / (NDAYS - 1) * 100;
      fillEl.style.width = pct + '%';
      handleEl.style.left = pct + '%';
      const atEnd = day >= NDAYS - 1 && !playing;
      whenEl.textContent = atEnd ? `${fmtMonth(0)} — ${fmtMonth(NDAYS - 1)}` : fmtDay(day);
      const c = st.current && cities[st.current.city];
      whereEl.textContent = !atEnd && c ? `${c.city}, ${c.countryCode}` : '';
      const n = (v, one, many) => `<b>${fmt(v)}</b> ${v === 1 ? one : many}`;
      totalsEl.innerHTML = [n(st.checkins, 'check-in', 'check-ins'), n(st.markers.length, 'city', 'cities'), n(st.countries, 'country', 'countries')].join(' · ');
    }

    (function ticks() {
      const y0 = dateOf(0).getUTCFullYear(), y1 = dateOf(NDAYS - 1).getUTCFullYear();
      for (let y = y0 + 1; y <= y1; y++) {
        if (y % 2) continue;
        const i = dayNum(`${y}-01-01`) - DAY0;
        const t = document.createElement('div');
        t.className = 'tick';
        t.style.left = (i / (NDAYS - 1) * 100) + '%';
        t.innerHTML = `<span>'${String(y).slice(2)}</span>`;
        trackEl.appendChild(t);
      }
    })();

    // ---- photo stacks ------------------------------------------------------------
    const stackEl = document.getElementById('stack');
    let activeShot = null;
    const FAN = [[0, 0, -2.5], [10, -8, 3.5], [-8, -14, -6], [14, -20, 7]];
    function momentAt(day) {
      let m = null;
      for (const s of shots) { if (s.at > day) break; m = s; }
      return m;
    }
    function showMoment(m) {
      if (m === activeShot) return;
      activeShot = m;
      stackEl.classList.add('out');
      const build = () => {
        if (activeShot !== m) return;
        stackEl.classList.remove('out');
        stackEl.innerHTML = '';
        if (!m) return;
        const n = m.photos.length;
        m.photos.forEach((src, k) => {
          const [x, y, r] = FAN[(n - 1 - k) % FAN.length];
          const card = document.createElement('div');
          card.className = 'card pre';
          card.style.cssText = `--x:${x}px;--y:${y}px;--r:${r}deg;--d:${k * 90}ms;z-index:${k}`;
          const img = new Image();
          img.src = src; img.alt = m.caption || m.city; img.decoding = 'async';
          card.appendChild(img);
          stackEl.appendChild(card);
        });
        if (m.caption) {
          const cap = document.createElement('div');
          cap.className = 'cap pre';
          cap.style.setProperty('--d', `${n * 90}ms`);
          cap.textContent = m.caption;
          stackEl.appendChild(cap);
        }
        stackEl.getBoundingClientRect();
        for (const el of stackEl.children) el.classList.remove('pre');
      };
      stackEl.children.length ? setTimeout(build, 200) : build();
    }

    // ---- play loop -------------------------------------------------------------
    let playing = false, dragging = false, scrubbing = false, dirty = true;
    const playIcon = document.getElementById('playIcon');
    function setPlaying(on) {
      playing = on;
      playIcon.innerHTML = on
        ? '<rect x="1" y="1" width="3.5" height="12" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" fill="currentColor"/>'
        : '<path d="M1 1l11 6L1 13z" fill="currentColor"/>';
      document.getElementById('play').setAttribute('aria-label', on ? 'Pause' : 'Play the decade');
      shown = -1;
    }
    document.getElementById('play').addEventListener('click', () => {
      if (playing) { setPlaying(false); return; }
      if (head >= NDAYS - 1) { head = 0; arcBorn.clear(); }
      setPlaying(true);
    });

    let last = 0, arcsFading = false;
    function frame(now) {
      const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;

      if (playing) {
        const rate = nearTravel[Math.floor(head)] ? TRAVEL_DAYS_PER_SEC : NDAYS / PLAY_SECONDS;
        head = Math.min(NDAYS - 1, head + rate * dt);
        if (head >= NDAYS - 1) setPlaying(false);
      }

      const day = Math.floor(head);
      const update = {};
      if (day !== shown) {
        const prevLegs = st.legs;
        st = stateAt(day);
        if (playing) for (const l of st.legs) if (!prevLegs.includes(l)) arcBorn.set(l, now);
        update.markers = st.markers;
        arcsFading = true;
        shown = day;
        syncUI(day);
        showMoment(momentAt(day));
      }
      if (arcsFading) {
        const r = arcsFor(st.legs, now);
        update.arcs = r.arcs;
        arcsFading = r.fading;
      }

      const still = reduceMotion.matches;
      if (!dragging && !still) {
        const dest = playing && st.legs.length ? cities[st.legs[st.legs.length - 1].to] : null;
        if (dest) {
          const [tp, tt] = anglesFor(dest);
          const k = 1 - Math.exp(-dt * 2.2);
          phi += wrap(tp - phi) * k;
          theta += (tt - theta) * k;
        } else if (!scrubbing) {
          phi += dt * 0.06;
        }
        dirty = true;
      }

      if (dirty || update.markers || update.arcs) {
        update.phi = phi; update.theta = theta;
        globe.update(update);
        dirty = false;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ---- drag to rotate ----------------------------------------------------------
    let px = 0, py = 0;
    canvas.addEventListener('pointerdown', e => {
      dragging = true; px = e.clientX; py = e.clientY;
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', e => {
      if (!dragging) return;
      const k = 3 / size;
      phi += (e.clientX - px) * k;
      theta = Math.max(-0.9, Math.min(0.9, theta + (e.clientY - py) * k));
      px = e.clientX; py = e.clientY;
      dirty = true;
    });
    const endDrag = () => { dragging = false; canvas.classList.remove('dragging'); };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    // iOS starts its overscroll before the first pointermove unless touchstart is claimed.
    canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

    // ---- scrubbing -------------------------------------------------------------
    function seek(e) {
      const rect = trackEl.getBoundingClientRect();
      head = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * (NDAYS - 1);
    }
    trackEl.addEventListener('pointerdown', e => {
      scrubbing = true; setPlaying(false); seek(e);
      trackEl.setPointerCapture(e.pointerId);
    });
    trackEl.addEventListener('pointermove', e => { if (scrubbing) seek(e); });
    trackEl.addEventListener('pointerup', () => { scrubbing = false; });
    trackEl.addEventListener('pointercancel', () => { scrubbing = false; });
    trackEl.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

    addEventListener('resize', () => {
      layout();
      globe.update({ width: size, height: size });
      dirty = true;
    });
  </script>
</body>
</html>
