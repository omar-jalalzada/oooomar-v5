<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    One Farsh entry. The three cuts stay as vN/ so a pass is never overwritten —
    this page is just the shell that picks which one to load.
      v1/ — cursor orb: hovering lifts the wool into an orbiting cloud
      v2/ — the wave: a crest weaves the rug top to bottom out of particles
      v3/ — the loom: the crest is only a reveal, and the rug's own tufts
            arrive as long twirling yarn that shortens into each knot
    three.module.js is vendored once here and shared by all of them.

    Paths always end in index.html so the iframe works under Vite's public/
    server (no directory indexes) as well as on Vercel.
  -->
  <title>Farsh</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0908;
      color: #e7dcc3;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      -webkit-font-smoothing: antialiased;
    }

    /* Slim bar along the top. Left-aligned so it doesn't collide with the
       dial panels each version parks in the top-right. */
    #bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      padding: 0 14px;
      background: rgba(11, 9, 8, 0.88);
      border-bottom: 1px solid rgba(231, 220, 195, 0.14);
      backdrop-filter: blur(14px);
    }
    #bar .mark {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.55;
      font-size: 11px;
      flex-shrink: 0;
    }
    #bar label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
    #version {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      padding: 6px 28px 6px 10px;
      border: 1px solid rgba(231, 220, 195, 0.22);
      border-radius: 6px;
      background:
        linear-gradient(45deg, transparent 50%, #e7dcc3 50%) calc(100% - 14px) 50% / 5px 5px no-repeat,
        linear-gradient(135deg, #e7dcc3 50%, transparent 50%) calc(100% - 10px) 50% / 5px 5px no-repeat,
        rgba(16, 12, 11, 0.9);
      color: #e7dcc3;
      font: inherit;
      letter-spacing: 0.04em;
      cursor: pointer;
      max-width: min(420px, calc(100vw - 100px));
    }
    #version:hover,
    #version:focus-visible {
      border-color: rgba(231, 220, 195, 0.5);
      outline: none;
    }
    #version option {
      background: #14100f;
      color: #e7dcc3;
    }

    #stage {
      position: absolute;
      inset: 40px 0 0;
      border: 0;
      width: 100%;
      height: calc(100% - 40px);
      background: #0b0908;
    }
  </style>
</head>
<body>
  <div id="bar">
    <span class="mark">Farsh</span>
    <label for="version">Version</label>
    <select id="version">
      <option value="v1">v1 — cursor orb</option>
      <option value="v2">v2 — the wave</option>
      <option value="v3">v3 — the loom</option>
    </select>
  </div>
  <iframe id="stage" title="Farsh" allow="autoplay"></iframe>

  <script>
    const VERSIONS = {
      v1: { src: 'v1/index.html', title: 'Farsh v1 — cursor orb' },
      v2: { src: 'v2/index.html', title: 'Farsh v2 — the wave' },
      v3: { src: 'v3/index.html', title: 'Farsh v3 — the loom' },
    };
    const DEFAULT = 'v1';
    const KEY = 'farsh-version';

    const select = document.getElementById('version');
    const stage = document.getElementById('stage');

    function readInitial() {
      const fromHash = location.hash.replace(/^#/, '');
      if (VERSIONS[fromHash]) return fromHash;
      try {
        const stored = localStorage.getItem(KEY);
        if (VERSIONS[stored]) return stored;
      } catch (_) { /* private mode */ }
      return DEFAULT;
    }

    function load(id) {
      const v = VERSIONS[id] || VERSIONS[DEFAULT];
      select.value = VERSIONS[id] ? id : DEFAULT;
      stage.src = v.src;
      document.title = v.title;
      // Hash so a shared URL can land on a specific cut, and so a refresh keeps it.
      if (location.hash.replace(/^#/, '') !== select.value) {
        history.replaceState(null, '', '#' + select.value);
      }
      try { localStorage.setItem(KEY, select.value); } catch (_) { /* private mode */ }
    }

    select.addEventListener('change', () => load(select.value));
    window.addEventListener('hashchange', () => {
      const id = location.hash.replace(/^#/, '');
      if (VERSIONS[id] && id !== select.value) load(id);
    });

    load(readInitial());
  </script>
</body>
</html>
