<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grain</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0E0D0C; }
    canvas { display: block; position: absolute; inset: 0; }
    #grain { opacity: 0.07; mix-blend-mode: screen; pointer-events: none; }
    .hint {
      position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #6B6256; pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="grain"></canvas>
  <p class="hint">move your cursor — the light follows</p>
  <script>
    const bg = document.getElementById('bg'), bx = bg.getContext('2d');
    const gr = document.getElementById('grain'), gx = gr.getContext('2d');
    let w, h;
    const light = { x: innerWidth / 2, y: innerHeight / 2 };
    const cur = { x: light.x, y: light.y };

    function resize() {
      w = bg.width = gr.width = innerWidth;
      h = bg.height = gr.height = innerHeight;
    }
    resize(); addEventListener('resize', resize);
    addEventListener('pointermove', (e) => { light.x = e.clientX; light.y = e.clientY; });

    // a small noise tile, redrawn with a random offset each frame
    const tile = document.createElement('canvas');
    tile.width = tile.height = 140;
    const tx = tile.getContext('2d');
    function noise() {
      const img = tx.createImageData(140, 140);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      tx.putImageData(img, 0, 0);
    }

    function frame() {
      cur.x += (light.x - cur.x) * 0.05;
      cur.y += (light.y - cur.y) * 0.05;
      const g = bx.createRadialGradient(cur.x, cur.y, 0, cur.x, cur.y, Math.max(w, h) * 0.7);
      g.addColorStop(0, '#D98A3D');
      g.addColorStop(0.4, '#5A3A1E');
      g.addColorStop(1, '#0E0D0C');
      bx.fillStyle = g;
      bx.fillRect(0, 0, w, h);

      noise();
      gx.clearRect(0, 0, w, h);
      const ox = -Math.random() * 140, oy = -Math.random() * 140;
      for (let x = ox; x < w; x += 140)
        for (let y = oy; y < h; y += 140)
          gx.drawImage(tile, x, y);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
